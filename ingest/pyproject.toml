[project]
name = "tenderhub"
version = "0.1.0"
description = "Universal public-procurement scraper core: pluggable connectors, incremental sync, SQLite storage"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "selectolax>=0.3.27",
    "lxml>=5.3",
    "python-dateutil>=2.9",
]

[project.scripts]
tenderhub = "tenderhub.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real source over the network (run with -m live)"]
addopts = "-m 'not live'"
