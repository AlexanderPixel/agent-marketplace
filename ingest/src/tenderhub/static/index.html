<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tenderhub</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #16191d; --muted: #5d6670; --line: #e3e6ea; --accent: #2457d6;
  --accent-soft: #e8eefc; --red: #b3261e; --red-soft: #fbe9e7; --green: #1f7a3a; --green-soft: #e6f4ea;
  --amber: #8a5a00; --amber-soft: #fff3d6; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1114; --panel: #171a1f; --text: #e7eaee; --muted: #9aa3ad; --line: #2a2f36; --accent: #7aa2ff;
    --accent-soft: #1d2740; --red: #ff8a80; --red-soft: #3a1f1d; --green: #7fd69a; --green-soft: #17301f;
    --amber: #ffcf66; --amber-soft: #352a12; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; }
.top { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.kpis { display: flex; gap: 22px; flex-wrap: wrap; }
.kpi b { font-size: 18px; font-variant-numeric: tabular-nums; display: block; }
.kpi span { color: var(--muted); font-size: 12px; }
.live { font-size: 12px; color: var(--muted); margin-left: auto; }
.live .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 1.4s infinite; }
.live.idle .dot { background: var(--muted); animation: none; }
@keyframes pulse { 50% { opacity: .3; } }
nav { display: flex; gap: 4px; margin-top: 10px; }
nav button { border: 0; background: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding: 16px 20px 40px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input, .filters select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
.filters input[type=search] { flex: 1 1 280px; min-width: 200px; }
.filters label { display: flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; }
.count { color: var(--muted); margin: 4px 0 10px; }
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--panel); position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
td.t { min-width: 340px; }
td.t .title { font-weight: 500; }
td.t .buyer { color: var(--muted); font-size: 12.5px; }
.num, .date { white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.s-open { background: var(--green-soft); color: var(--green); }
.s-closed, .s-unknown { background: var(--line); color: var(--muted); }
.s-awarded { background: var(--accent-soft); color: var(--accent); }
.s-cancelled { background: var(--red-soft); color: var(--red); }
.def { background: var(--red-soft); color: var(--red); }
.src { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; }
.pager button, .btn { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; cursor: pointer; }
.pager button:disabled { opacity: .4; cursor: default; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
#drawer { position: fixed; inset: 0 0 0 auto; width: min(960px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .18s ease; z-index: 10; overflow-y: auto; padding: 20px 24px 40px; box-shadow: -10px 0 30px rgba(0,0,0,.12); }
#drawer.open { transform: none; }
#drawer h2 { font-size: 17px; margin: 6px 0 12px; }
#drawer dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin: 0 0 16px; }
#drawer dt { color: var(--muted); }
#drawer dd { margin: 0; word-break: break-word; }
#drawer pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 360px; font-size: 12px; }
#drawer .close { float: right; }
.desc { white-space: pre-wrap; background: var(--bg); padding: 10px 12px; border-radius: 8px; max-height: 260px; overflow: auto; }
a { color: var(--accent); }
.bar { height: 6px; background: var(--accent); border-radius: 3px; }
.err { color: var(--red); font-size: 12px; }
.enrich { display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
.folder { font-weight: 600; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
ul.att { list-style: none; padding: 0; margin: 0; }
ul.att li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 5px 0; border-bottom: 1px solid var(--line); }
ul.att .aname { flex: 1 1 260px; word-break: break-word; }
.preview { margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
.preview .ptitle { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.preview iframe { width: 100%; height: 70vh; border: 0; border-radius: 6px; background: #fff; }
pre.atext { white-space: pre-wrap; max-height: 60vh; overflow: auto; font-size: 12px; }
details.page { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 6px 10px; }
details.page summary { cursor: pointer; font-weight: 500; }
.page-meta { font-size: 12px; margin: 6px 0; word-break: break-all; }
.md { font-size: 13.5px; }
.md h3, .md h4, .md h5, .md h6 { margin: 14px 0 6px; font-size: 14px; }
.md h3 { font-size: 15px; }
.md p { margin: 4px 0; }
table.mdt { font-size: 12.5px; margin: 8px 0; }
table.mdt th, table.mdt td { padding: 4px 6px; }
.also { font-size: 11px; color: var(--accent); margin-top: 2px; }
.copies li { margin-bottom: 4px; }
@media (max-width: 700px) { header, main { padding-left: 16px; padding-right: 16px; } td.t { min-width: 220px; } }

/* ---- notice panel: Brief | Verbose ---- */
:root { --mark: #ffe58a; }
@media (prefers-color-scheme: dark) { :root { --mark: #5c4a00; } }
#drawer { container-type: inline-size; container-name: drawer; }
.dtop { position: sticky; top: -20px; z-index: 3;  /* -20px = the drawer's top padding */ display: flex; align-items: center; gap: 10px; margin: -20px -24px 14px; padding: 10px 24px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.dtop .dsrc { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); flex: none; }
.seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
a.btn { text-decoration: none; display: inline-block; }
.pill.amend, .pill.sample { background: var(--amber-soft); color: var(--amber); }
.pill.soft { background: var(--line); color: var(--muted); }
button.pill { border: 0; font-family: inherit; cursor: pointer; }
.b-loading { color: var(--muted); padding: 30px 0; text-align: center; }
.b-hero { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: var(--bg); }
.b-hero .b-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#drawer .b-hero h2 { margin: 8px 0 2px; font-size: 18px; line-height: 1.3; word-break: break-word; }
.b-buyer { color: var(--muted); }
.b-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.b-fact { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.b-fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.b-fact .v { font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-word; }
.b-fact .v.none { color: var(--muted); font-weight: 400; }
.b-fact.due { grid-column: span 2; }
.b-fact.due .v { font-size: 15px; }
.cd { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.cd.ok { background: var(--green-soft); color: var(--green); }
.cd.soon { background: var(--amber-soft); color: var(--amber); }
.cd.urgent { background: var(--red-soft); color: var(--red); }
.cd.past { background: var(--line); color: var(--muted); }
.b-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.b-jump { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 4px; }
.b-jump button { border: 0; font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.b-jump button b { font-weight: 600; margin-left: 4px; }
.b-sec { margin: 26px 0 0; scroll-margin-top: 60px; }
#drawer .b-sec > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
#drawer .b-sec > h3 .n { font-weight: 500; margin-left: 4px; }
#drawer .b-sec h4 { font-size: 13px; margin: 14px 0 6px; }
.cite { display: inline-flex; align-items: baseline; gap: 4px; max-width: 240px; vertical-align: baseline; font: 11px/1.7 var(--mono); color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; cursor: pointer; white-space: nowrap; }
.cite .cn { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cite b, .cite i { flex: none; font-style: normal; }
.cite i { color: var(--amber); }
.cite:hover { color: var(--accent); border-color: var(--accent); }
.cite.dead { cursor: help; opacity: .65; }
.cite.dead:hover { color: var(--muted); border-color: var(--line); }
.box { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
table.b-lots td, table.b-lots th { padding: 8px 12px; }
table.b-lots tbody tr { cursor: default; }
table.b-lots tbody tr:hover { background: none; }
table.b-lots tr:last-child td { border-bottom: 0; }
table.b-lots .lotno { font-weight: 600; white-space: nowrap; }
table.b-lots .qty { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12px; }
ol.tl { list-style: none; padding: 0; margin: 0; }
ol.tl > li { position: relative; padding: 0 0 14px 24px; }
ol.tl > li::before { content: ""; position: absolute; left: 3px; top: 6px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--accent); box-sizing: border-box; }
ol.tl > li::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
ol.tl > li:last-child::after { display: none; }
ol.tl > li.past { opacity: .5; }
ol.tl > li.past::before { border-color: var(--muted); }
ol.tl > li.now { padding-bottom: 12px; color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
ol.tl > li.now::before { background: var(--accent); width: 14px; height: 2px; border: 0; border-radius: 0; left: 1px; top: 9px; }
ol.tl > li.key .tl-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin-top: -4px; }
ol.tl > li.key::before { background: var(--accent); }
.tl-when { font-weight: 600; font-variant-numeric: tabular-nums; }
.tl-rel { color: var(--muted); font-size: 12px; margin-left: 6px; }
.tl-lbl { word-break: break-word; }
.tl-card ul { margin: 6px 0 2px; padding-left: 18px; }
.kv { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 0; margin-bottom: 4px; }
.kv > div { padding: 7px 12px; border-bottom: 1px solid var(--line); }
.kv > .k { color: var(--muted); }
.kv > div:nth-last-child(-n+2) { border-bottom: 0; }
.ck-prog { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); margin: 14px 0 4px; }
.ck-prog .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.ck-prog .track div { height: 100%; background: var(--green); transition: width .2s; }
ul.ck { list-style: none; padding: 0; margin: 0; }
ul.ck li { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: flex-start; }
ul.ck li:last-child { border-bottom: 0; }
ul.ck input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--green); flex: none; cursor: pointer; }
ul.ck .ck-body { flex: 1; min-width: 0; }
ul.ck .ck-doc { cursor: pointer; word-break: break-word; }
ul.ck li.done .ck-doc { text-decoration: line-through; color: var(--muted); }
a.tpl { font-size: 12px; word-break: break-word; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 160px) 58px; gap: 4px 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.crit:last-child { border-bottom: 0; }
.crit.nobar { grid-template-columns: minmax(0, 1fr); }
.sub.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.sub.clamp.open { display: block; }
.crit .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.crit .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.crit.pts .fill { background: var(--green); }
.crit .w { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
details.b-grp { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--panel); }
details.b-grp > summary { padding: 8px 12px; cursor: pointer; font-weight: 600; }
details.b-grp > summary .n { color: var(--muted); font-weight: 400; margin-left: 4px; }
details.b-grp ul { margin: 0; padding: 0 12px 10px 32px; }
details.b-grp li { margin: 5px 0; }
.b-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.b-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; word-break: break-word; }
.b-card .role { font-size: 12px; color: var(--muted); }
.b-note { color: var(--muted); background: var(--bg); border-radius: 10px; padding: 14px; margin-top: 16px; }
.b-cta { border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
.b-cta p { color: var(--muted); margin: 6px 0 0; }
.b-foot { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.b-foot .enrich { margin: 8px 0 0; }
.b-foot details summary { cursor: pointer; }
.b-foot .err { margin: 4px 0; }
#docview { position: fixed; inset: 0 0 0 auto; width: min(960px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 12;
  overflow-y: auto; padding: 0 24px 40px; box-shadow: -10px 0 30px rgba(0,0,0,.18); }
#docview[hidden] { display: none; }
.dv-top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); margin: 0 -24px 12px; padding: 10px 24px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dv-top .dv-name { flex: 1 1 200px; min-width: 0; font-weight: 600; word-break: break-word; }
.dv-quote { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 0 0 12px; font-size: 13px; }
.dv-quote .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; }
#docview iframe { width: 100%; height: 72vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
#docview details { margin-top: 10px; }
#docview details summary { cursor: pointer; color: var(--muted); }
#docview pre.atext { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: none; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
@media (max-width: 700px) {
  #drawer, #docview { padding-left: 16px; padding-right: 16px; }
  .dtop, .dv-top { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
}
@container drawer (max-width: 560px) {
  #drawer dl { grid-template-columns: 96px minmax(0, 1fr); }
  .b-fact.due { grid-column: 1 / -1; }
  .b-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv > .k { padding-bottom: 0; border-bottom: 0; font-size: 12px; }
  .kv > div:nth-last-child(2) { border-bottom: 0; }
  .kv > div:nth-last-child(1) { border-bottom: 0; }
  .crit { grid-template-columns: minmax(0, 1fr) 58px; }
  .crit .nm { grid-column: 1 / -1; }
  .seg button { padding: 4px 9px; }
  .dtop .dsrc { display: none; }
  .dtop .seg { margin-right: auto; }
  ul.att .aname { flex-basis: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>tenderhub</h1>
    <div class="kpis" id="kpis"></div>
    <div class="live idle" id="live"><span class="dot"></span><span id="livetext">—</span></div>
  </div>
  <nav><button data-tab="notices" class="on">Notices</button><button data-tab="sources">Sources</button></nav>
</header>
<main>
  <section id="tab-notices">
    <div class="filters">
      <input type="search" id="q" placeholder="Search title, description, buyer — e.g. amunicja, drone, Bundeswehr">
      <select id="source"><option value="">All sources</option></select>
      <select id="country"><option value="">All countries</option></select>
      <select id="status"><option value="">Any status</option><option>open</option><option>closed</option><option>awarded</option><option>cancelled</option><option>unknown</option></select>
      <select id="type"><option value="">Any type</option><option>tender</option><option>plan</option><option>award</option><option>modification</option><option>cancellation</option><option>other</option></select>
      <input id="cpv" placeholder="CPV prefix (35)" size="12">
      <label><input type="checkbox" id="defence"> Defence only</label>
      <label><input type="checkbox" id="upcoming"> Deadline ahead</label>
      <label title="Show each tender once even when several sources published it"><input type="checkbox" id="merge" checked> Merge duplicates</label>
      <select id="sort"><option value="published">Newest published</option><option value="deadline">Soonest deadline</option><option value="value">Highest value</option><option value="seen">Recently scraped</option></select>
    </div>
    <div class="count" id="count"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Published</th><th>Country</th><th>Source</th><th>Notice</th><th>Status</th><th>Deadline</th><th class="num">Value</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="pager"><button id="prev">← Prev</button><span id="pageinfo"></span><button id="next">Next →</button></div>
  </section>
  <section id="tab-sources" hidden>
    <div class="table-wrap"><table>
      <thead><tr><th>Source</th><th class="num">Notices</th><th style="width:25%"></th><th class="num">Open</th><th class="num">Defence</th><th>Latest notice</th><th>Last successful sync</th><th>Next sync</th></tr></thead>
      <tbody id="srcrows"></tbody>
    </table></div>
    <div id="failing"></div>
  </section>
</main>
<aside id="drawer"></aside>
<aside id="docview" hidden></aside>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = (n) => (n ?? 0).toLocaleString();
const day = (s) => (s || "").slice(0, 10);
const when = (s) => s ? s.replace("T", " ").slice(0, 16) : "";
const money = (v, c) => v == null ? "" : `${Math.round(v).toLocaleString()} ${c || ""}`;
const FILTERS = ["q", "source", "country", "status", "type", "cpv", "sort"];
const TOGGLES = ["defence", "upcoming", "merge"];
let page = 1, total = 0, size = 50, populated = false, timer;
const BOOT = new URLSearchParams(location.search);
const SAMPLE = BOOT.get("sample") === "1";  // render tests/fixtures/vm191/brief-sample.json instead of /api/brief
const LS = {  // localStorage can throw (private mode, blocked storage): every access is guarded
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* not persisted */ } },
};

function params() {
  const p = new URLSearchParams();
  for (const f of FILTERS) if ($(f).value) p.set(f, $(f).value.trim());
  for (const t of TOGGLES) p.set(t, $(t).checked ? "1" : "0");
  p.set("page", page); p.set("size", size);
  return p;
}

async function loadNotices() {
  const p = params();
  const shown = new URLSearchParams(p);
  if (SAMPLE) shown.set("sample", "1");
  history.replaceState(null, "", "?" + shown);
  const res = await fetch("/api/notices?" + p);
  const d = await res.json();
  if (d.error) { $("rows").innerHTML = `<tr><td colspan="7" class="empty err">${esc(d.error)}</td></tr>`; return; }
  total = d.total;
  $("count").textContent = `${fmtN(total)} ${$("merge").checked ? "unique tenders" : "notices"} match`;
  $("rows").innerHTML = d.rows.length ? d.rows.map(r => `
    <tr data-id="${r.id}">
      <td class="date">${day(r.published_at)}</td>
      <td>${esc(r.buyer_country || "—")}</td>
      <td class="src">${esc(r.source)}${r.also_on ? `<div class="also" title="Same tender also published on these sources">+ ${esc(r.also_on.split(",").join(", "))}</div>` : ""}</td>
      <td class="t"><div class="title">${esc(r.title)} ${r.is_defence ? '<span class="pill def">DEFENCE</span>' : ""}</div>
        <div class="buyer">${esc(r.buyer_name || "")}${r.buyer_city ? " · " + esc(r.buyer_city) : ""} · ${esc(r.notice_type)}</div></td>
      <td><span class="pill s-${r.status}">${r.status}</span></td>
      <td class="date">${when(r.deadline_at)}</td>
      <td class="num">${money(r.value_amount, r.value_currency)}</td>
    </tr>`).join("") : `<tr><td colspan="7" class="empty">No notices match these filters.</td></tr>`;
  const pages = Math.max(1, Math.ceil(total / size));
  $("pageinfo").textContent = `page ${page} of ${fmtN(pages)}`;
  $("prev").disabled = page <= 1; $("next").disabled = page >= pages;
}

async function loadStats() {
  const s = await (await fetch("/api/stats")).json();
  const t = s.totals;
  $("kpis").innerHTML = [["unique tenders", t.tenders], ["notices scraped", t.notices], ["sources", t.sources], ["countries", t.countries],
    ["buyers", t.buyers], ["open now", t.open], ["defence", t.defence]]
    .map(([k, v]) => `<div class="kpi"><b>${fmtN(v)}</b><span>${k}</span></div>`).join("");
  const running = s.running.filter(r => r.kind === "sync");
  $("live").classList.toggle("idle", !running.length);
  $("livetext").textContent = running.length ? `syncing ${running.length}: ${running.map(r => r.source).join(", ")}` : "no sync running";
  if (!populated) {
    $("source").innerHTML += s.sources.map(x => `<option>${esc(x.source)}</option>`).join("");
    $("country").innerHTML += s.countries.map(x => `<option value="${esc(x.country)}">${esc(x.country)} (${fmtN(x.notices)})</option>`).join("");
    const q = new URLSearchParams(location.search);
    for (const f of FILTERS) if (q.get(f)) $(f).value = q.get(f);
    $("defence").checked = q.get("defence") === "1"; $("upcoming").checked = q.get("upcoming") === "1";
    $("merge").checked = q.get("merge") !== "0";
    page = +(q.get("page") || 1);
    populated = true;
    await loadNotices();
  }
  const max = Math.max(1, ...s.sources.map(x => x.notices));
  $("srcrows").innerHTML = s.sources.map(x => `
    <tr data-source="${esc(x.source)}"><td class="src">${esc(x.source)}</td><td class="num">${fmtN(x.notices)}</td>
    <td><div class="bar" style="width:${(100 * x.notices / max).toFixed(1)}%"></div></td>
    <td class="num">${fmtN(x.open)}</td><td class="num">${fmtN(x.defence)}</td><td class="date">${day(x.latest)}</td>
    <td class="date">${when(x.last_success_at)}${x.last_error ? `<div class="err">${esc(x.last_error.slice(0, 120))}</div>` : ""}</td>
    <td class="date">${when(x.next_run_at)}</td></tr>`).join("");
  $("failing").innerHTML = s.failing.length ? `<h3>Sources with no data yet</h3><ul>${s.failing.map(f =>
    `<li><span class="src">${esc(f.source)}</span> — <span class="err">${esc(f.last_error)}</span></li>`).join("")}</ul>` : "";
}

// ---- notice panel: Brief (decision-ready, every item cited) | Verbose (everything captured) ----
const VIEW_KEY = "tenderhub.view";
let current = null;  // {id, n, captured, mode, brief}
let CITES = [];      // citation targets of the rendered brief, referenced by index from data-cite

async function openNotice(id) {
  let n;
  try { n = await (await fetch("/api/notice?id=" + id)).json(); } catch (e) { n = {error: String(e)}; }
  if (n.error) {
    $("drawer").innerHTML = `<div class="dtop"><span class="dsrc"></span><button class="btn" onclick="closeDrawer()">Close ✕</button></div>
      <p class="err">${esc(n.error)}</p>`;
    $("drawer").classList.add("open");
    return;
  }
  const captured = n.pages.length > 0 || n.attachments.length > 0;
  const pref = LS.get(VIEW_KEY, null);
  const mode = pref === "brief" || pref === "verbose" ? pref : captured || SAMPLE ? "brief" : "verbose";
  current = {id: n.id, n, captured, mode, brief: null};
  closeDoc();
  $("drawer").innerHTML = `
    <div class="dtop">
      <span class="src dsrc" title="${esc(n.source)} · ${esc(n.source_id)}">${esc(n.source)} · ${esc(n.source_id)}</span>
      <div class="seg" role="tablist" aria-label="View mode">
        <button role="tab" data-mode="brief">Brief</button><button role="tab" data-mode="verbose">Verbose</button>
      </div>
      <button class="btn" onclick="closeDrawer()">Close ✕</button>
    </div>
    <div id="dview"></div>`;
  $("drawer").classList.add("open");
  $("drawer").scrollTop = 0;
  renderView();
}

function setMode(mode) {
  if (!current || current.mode === mode) return;
  LS.set(VIEW_KEY, mode);
  current.mode = mode;
  $("drawer").scrollTop = 0;
  renderView();
}

function renderView() {
  const c = current;
  document.querySelectorAll("#drawer .seg button").forEach(b => {
    const on = b.dataset.mode === c.mode;
    b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
  });
  if (c.mode === "verbose") $("dview").innerHTML = verboseHTML(c.n);
  else renderBrief(c);
}

function verboseHTML(n) {
  const refs = Object.entries(n.refs || {}).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>");
  return `
    <h2>${esc(n.title)}</h2>
    <p><span class="pill s-${n.status}">${n.status}</span> ${n.is_defence ? `<span class="pill def">DEFENCE · ${esc((n.defence_reasons || []).join(", "))}</span>` : ""}</p>
    <p><a href="${esc(n.url)}" target="_blank" rel="noopener">Open original notice ↗</a>
       ${n.platform_url && n.platform_url !== n.url ? ` · <a href="${esc(n.platform_url)}" target="_blank" rel="noopener">Bid / documents platform ↗</a>` : ""}</p>
    <dl>
      <dt>Buyer</dt><dd>${esc(n.buyer_name || "—")}${n.buyer_id ? ` <span class="src">(${esc(n.buyer_id)})</span>` : ""}</dd>
      <dt>Location</dt><dd>${esc([n.buyer_city, n.buyer_country].filter(Boolean).join(", ") || "—")}</dd>
      <dt>Type</dt><dd>${esc(n.notice_type)}${n.procedure_type ? " · " + esc(n.procedure_type) : ""}${n.legal_basis ? " · " + esc(n.legal_basis) : ""}</dd>
      <dt>Published</dt><dd>${when(n.published_at) || "—"}</dd>
      <dt>Deadline</dt><dd>${when(n.deadline_at) || "—"}</dd>
      <dt>Value</dt><dd>${money(n.value_amount, n.value_currency) || "—"}</dd>
      <dt>CPV</dt><dd>${n.cpv_codes.map(c => `<span class="src">${c}</span>`).join(" ") || "—"}</dd>
      <dt>References</dt><dd>${refs || "—"}</dd>
      <dt>Scraped</dt><dd>first ${when(n.first_seen_at)} · last seen ${when(n.last_seen_at)} · version ${n.version}${n.versions.length > 1 ? ` (changed ${n.versions.length - 1}×)` : ""}</dd>
    </dl>
    ${n.copies.length ? `<h3>Same tender elsewhere (${n.copies.length})</h3><ul class="copies">${n.copies.map(c =>
      `<li><a href="#" data-copy="${c.id}">${esc(c.source)}</a> · ${esc(c.notice_type)} · ${day(c.published_at)} · <span class="pill s-${c.status}">${c.status}</span>
       — <a href="${esc(c.url)}" target="_blank" rel="noopener">original ↗</a></li>`).join("")}</ul>` : ""}
    <div class="enrich">
      <button class="btn" id="enrich-btn" onclick="runEnrich(${n.id})">${n.pages.length || n.attachments.length ? "Re-fetch" : "Fetch"} tender page &amp; documents</button>
      <span class="src" id="enrich-status">${captureLine(n)}</span>
    </div>
    ${n.attachments.length ? `<h3>Attachments (${n.attachments.length})</h3>${attachmentList(n.attachments)}
      <div id="preview" class="preview" hidden></div>` : ""}
    ${n.pages.length ? `<h3>Tender pages</h3>${n.pages.map((p, i) => `
      <details class="page" ${i === 0 ? "open" : ""}><summary>${esc(p.title || p.url)} <span class="src">${esc(hostOf(p.url))}</span></summary>
        <div class="page-meta"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)} ↗</a></div>
        <div class="md">${md(p.markdown || "")}</div></details>`).join("")}` : ""}
    ${n.description ? `<h3>Description</h3><div class="desc">${esc(n.description)}</div>` : ""}
    ${n.documents.length ? `<h3>Documents (${n.documents.length})</h3><ul>${n.documents.map(d =>
      `<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title || d.url)}</a> ${d.kind ? `<span class="src">${esc(d.kind)}</span>` : ""}</li>`).join("")}</ul>` : ""}
    <h3>Raw source record</h3><pre>${esc(JSON.stringify(n.raw, null, 2))}</pre>`;
}
const captureLine = (n) => n.pages.length || n.attachments.length
  ? `captured ${when((n.pages[0] || n.attachments[0]).fetched_at)} · ${n.pages.length} pages · ${n.attachments.length} attachments` : "not captured yet";
const hostOf = (u) => { try { return new URL(u).hostname; } catch { return u; } };

// -- brief data --
async function renderBrief(c) {
  if (!c.captured && !SAMPLE) {
    CITES = [];
    $("dview").innerHTML = heroHTML(summaryOf(c.n, null), c.n, null) + `
      <div class="b-cta"><b>Not captured yet</b>
        <p>Fetch the tender page and its documents to build the brief: lots, deadlines, what to submit, award criteria,
          requirements and amendments, each linked to the page of the document it comes from.</p>
        <div class="enrich"><button class="btn primary" id="enrich-btn" onclick="runEnrich(${c.n.id})">Fetch tender page &amp; documents</button>
          <span class="src" id="enrich-status"></span></div></div>`;
    return;
  }
  if (!c.brief) {
    $("dview").innerHTML = `<div class="b-loading">Reading ${c.n.attachments.length} documents…</div>`;
    try {
      c.brief = SAMPLE ? JSON.parse($("brief-sample").textContent) : await (await fetch("/api/brief?id=" + c.id)).json();
    } catch (e) { c.brief = {error: `could not build the brief (${e.message || e})`}; }
    if (current !== c || c.mode !== "brief") return;  // the panel moved on while the brief was building
  }
  $("dview").innerHTML = briefHTML(c.brief, c.n);
  updateProgress();
}

function summaryOf(n, b) {
  const base = {title: n.title, buyer: n.buyer_name, country: n.buyer_country, procedure: n.procedure_type, cpv: n.cpv_codes,
    deadline: n.deadline_at, value: n.value_amount, currency: n.value_currency, platform_url: n.platform_url,
    lots: null, documents: n.attachments.length, latest_version: null};
  for (const [k, v] of Object.entries(b?.summary || {})) if (v != null && !(Array.isArray(v) && !v.length)) base[k] = v;
  return base;
}

const SECTIONS = [["lots", "Lots"], ["deadlines", "Deadlines"], ["submit", "What to submit"], ["criteria", "Award criteria"],
  ["requirements", "Requirements"], ["amendments", "Amendments"], ["contacts", "Contacts"]];

function briefHTML(b, n) {
  CITES = [];
  const arr = (k) => Array.isArray(b[k]) ? b[k] : [];
  const s = summaryOf(n, b);
  const body = {
    lots: arr("lots").length ? lotsHTML(arr("lots")) : "",
    deadlines: arr("deadlines").length ? deadlinesHTML(arr("deadlines")) : "",
    submit: arr("checklist").length || arr("submission").length ? submitHTML(arr("submission"), arr("checklist"), n.id) : "",
    criteria: arr("criteria").length ? criteriaHTML(arr("criteria")) : "",
    requirements: arr("requirements").length ? requirementsHTML(arr("requirements")) : "",
    amendments: arr("amendments").length ? amendmentsHTML(arr("amendments")) : "",
    contacts: arr("contacts").length ? contactsHTML(arr("contacts")) : "",
  };
  const counts = {lots: arr("lots").length, deadlines: arr("deadlines").length, submit: arr("checklist").length || arr("submission").length,
    criteria: arr("criteria").length, requirements: arr("requirements").length, amendments: arr("amendments").length, contacts: arr("contacts").length};
  const shown = SECTIONS.filter(([k]) => body[k]);
  const errors = Object.entries(b.errors || {});
  return heroHTML(s, n, b)
    + (shown.length > 2 ? `<nav class="b-jump" aria-label="Sections">${shown.map(([k, t]) =>
        `<button data-jump="b-${k}">${t}<b>${counts[k]}</b></button>`).join("")}</nav>` : "")
    + shown.map(([k, t]) => `<section class="b-sec" id="b-${k}"><h3>${t}<span class="n">${counts[k]}</span></h3>${body[k]}</section>`).join("")
    + (b.error ? `<div class="b-note err">${esc(b.error)}</div>` : !shown.length
      ? `<div class="b-note">Nothing has been extracted from the documents yet. Switch to <a href="#" data-mode="verbose">Verbose</a> to read the captured pages and attachments.</div>` : "")
    + `<footer class="b-foot">
        ${SAMPLE ? `<span class="pill sample">SAMPLE DATA</span> rendered from tests/fixtures/vm191/brief-sample.json · ` : ""}
        ${b.built_at ? `Brief built ${esc(fmtAt(b.built_at))} from ${fmtN(s.documents)} documents. ` : ""}Each item cites the document and page it comes from.
        ${errors.length ? `<details><summary>${errors.length} section${errors.length > 1 ? "s" : ""} could not be extracted</summary>${errors.map(([k, v]) =>
          `<div class="err"><b>${esc(k)}</b>: ${esc(v)}</div>`).join("")}</details>` : ""}
        <div class="enrich"><button class="btn" id="enrich-btn" onclick="runEnrich(${n.id})">Re-fetch tender page &amp; documents</button>
          <span class="src" id="enrich-status">${captureLine(n)}</span></div>
      </footer>`;
}

function heroHTML(s, n, b) {
  const dls = Array.isArray(b?.deadlines) ? b.deadlines : [];
  const offer = dls.find(d => d.kind === "offer");
  const due = offer?.at || s.deadline;
  const amends = Array.isArray(b?.amendments) && b.amendments.length ? b.amendments.length
    : s.latest_version > 1 ? s.latest_version - 1 : 0;
  const lots = s.lots || (Array.isArray(b?.lots) ? b.lots.length : 0);
  const cpv = (s.cpv || []).slice(0, 3).map(c => `<span class="src">${esc(c)}</span>`).join(" ")
    + ((s.cpv || []).length > 3 ? ` <span class="src">+${s.cpv.length - 3}</span>` : "");
  const fact = (k, v, cls = "") => `<div class="b-fact ${cls}"><div class="k">${k}</div><div class="v${v ? "" : " none"}">${v || "not stated"}</div></div>`;
  return `<div class="b-hero">
    <div class="b-tags">
      <span class="pill s-${n.status}">${esc(n.status)}</span>
      ${n.is_defence ? `<span class="pill def">DEFENCE</span>` : ""}
      ${amends ? `<button class="pill amend" data-jump="b-amendments" title="The documents changed after publication">Amended ${amends}×</button>` : ""}
      ${SAMPLE ? `<span class="pill sample" title="?sample=1: rendering the sample brief, not /api/brief">SAMPLE</span>` : ""}
      <span class="src">${esc([s.country, n.notice_type].filter(Boolean).join(" · "))}</span>
    </div>
    <h2>${esc(s.title)}</h2>
    <div class="b-buyer">${esc(s.buyer || "Buyer not stated")}</div>
    <div class="b-facts">
      ${fact("Offer deadline", due ? `${esc(fmtAt(due))}<br>${countdown(due)} ${offer ? cite(offer.cite) : ""}` : "", "due")}
      ${fact("Lots", lots ? fmtN(lots) : "")}
      ${fact("Value", s.value != null ? esc(money(s.value, s.currency)) : "")}
      ${fact("Procedure", s.procedure ? esc(procLabel(s.procedure)) : "")}
      ${fact("CPV", cpv)}
    </div>
    <div class="b-actions">
      ${s.platform_url ? `<a class="btn primary" href="${esc(s.platform_url)}" target="_blank" rel="noopener">Bid platform: ${esc(hostOf(s.platform_url))} ↗</a>` : ""}
      ${n.url && n.url !== s.platform_url ? `<a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener">Original notice ↗</a>` : ""}
    </div>
  </div>`;
}
const procLabel = (p) => { const t = String(p).replace(/_/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };

function lotsHTML(lots) {
  return `<div class="box"><table class="b-lots"><thead><tr><th>Lot</th><th>Item</th><th class="qty">Quantity</th></tr></thead><tbody>${lots.map(l => `
    <tr><td class="lotno">${esc(l.lot ?? "—")}</td>
      <td><div>${esc(l.title || "")}</div>${l.description ? `<div class="sub clamp">${esc(l.description)}</div>` : ""}<div class="meta">${cite(l.cite)}</div></td>
      <td class="qty">${l.quantity != null ? `${esc(fmtQty(l.quantity))} <span class="src" title="${esc(unitName(l.unit))}">${esc(l.unit || "")}</span>` : "—"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
const fmtQty = (q) => typeof q === "number" ? q.toLocaleString() : String(q);
const unitName = (u) => ({EA: "each (Stück)", PCE: "piece", PK: "pack", KGM: "kilogram", LTR: "litre", MTR: "metre"}[String(u).toUpperCase()] || u || "");

function deadlinesHTML(list) {
  const items = list.map(d => ({...d, t: parseAt(d.at)})).sort((a, b) => (a.t ?? Infinity) - (b.t ?? Infinity));
  const now = Date.now();
  let marked = false;
  const out = [];
  const today = `<li class="now">Today · ${esc(new Date().toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"}))}</li>`;
  for (const d of items) {
    const past = d.t != null && d.t < now;
    if (!past && !marked && out.length) out.push(today);
    if (!past) marked = true;
    out.push(`<li class="${past ? "past" : ""} ${d.kind === "offer" ? "key" : ""}"><div class="tl-card">
      <span class="tl-when">${esc(fmtAt(d.at) || d.at || "date unclear")}</span><span class="tl-rel">${esc(relDays(d.t))}</span>
      <div class="tl-lbl">${esc(d.label)} ${d.kind && d.kind !== "other" ? `<span class="pill soft">${esc(KIND[d.kind] || d.kind)}</span>` : ""} ${cite(d.cite)}</div>
    </div></li>`);
  }
  if (!marked && out.length) out.push(today);
  return `<ol class="tl">${out.join("")}</ol>`;
}
const KIND = {offer: "offer", questions: "questions", binding_period: "binding period", contract_start: "contract start", contract_end: "contract end"};

const OBLIGATION = [["mandatory", "Mandatory"], ["if_applicable", "If applicable"], ["on_request", "On request"]];
const WHEN = {with_offer: "with the offer", on_request: "on request", after_award: "after award"};
const ckKey = (it) => `${it.lot ?? ""}|${it.document}`;
function submitHTML(submission, checklist, nid) {
  const state = LS.get(`tenderhub.checklist.${nid}`, {}) || {};
  const groups = OBLIGATION.map(([k, t]) => [t, checklist.filter(i => i.obligation === k)]);
  const other = checklist.filter(i => !OBLIGATION.some(([k]) => k === i.obligation));
  if (other.length) groups.push(["Other", other]);
  const how = submission.length ? `<h4>How to bid</h4><div class="box kv">${submission.map(x =>
    `<div class="k">${esc(x.label)}</div><div>${esc(x.value)} ${cite(x.cite)}</div>`).join("")}</div>` : "";
  if (!checklist.length) return how;
  return how + `<div class="ck-prog" id="ck-prog"></div>` + groups.filter(([, items]) => items.length).map(([t, items]) => `
    <h4>${t} <span class="src">${items.length}</span></h4>
    <ul class="ck box">${items.map(it => {
      const key = ckKey(it), done = !!state[key];
      const tpl = it.template ? templateLink(it.template, it.cite?.folder) : "";
      return `<li class="${done ? "done" : ""}" data-ob="${esc(it.obligation)}">
        <input type="checkbox" data-ck="${esc(key)}" ${done ? "checked" : ""} aria-label="${esc(it.document)}">
        <div class="ck-body"><div class="ck-doc">${esc(it.document)}</div>
          <div class="meta">${it.lot ? `<span class="pill soft">Lot ${esc(it.lot)}</span>` : ""}
            ${it.when && WHEN[it.when] && it.when !== it.obligation ? `<span class="src">${esc(WHEN[it.when])}</span>` : ""}
            ${tpl} ${cite(it.cite)}</div></div></li>`;
    }).join("")}</ul>`).join("");
}
function templateLink(file, folder) {
  const i = CITES.push({file, folder: null, page: null, quote: null}) - 1;
  const ok = resolveCite(CITES[i]);
  return ok ? `<a href="#" class="tpl" data-cite="${i}" title="${esc(file)}">Template: ${esc(shortName(file))}</a>`
    : `<span class="src" title="template not among the captured documents">Template: ${esc(shortName(file))}</span>`;
}
function updateProgress() {
  const box = $("ck-prog"); if (!box) return;
  const all = [...document.querySelectorAll("#drawer ul.ck li")];
  const done = all.filter(li => li.classList.contains("done")).length;
  const mand = all.filter(li => li.dataset.ob === "mandatory" && !li.classList.contains("done")).length;
  box.innerHTML = `<span>${done} of ${all.length} ready</span><div class="track"><div style="width:${all.length ? 100 * done / all.length : 0}%"></div></div>
    <span>${mand ? `${mand} mandatory open` : "all mandatory done"}</span>`;
}

function criteriaHTML(list) {
  const pct = list.filter(c => c.weight_unit === "%"), pts = list.filter(c => c.weight_unit === "points");
  const rest = list.filter(c => !pct.includes(c) && !pts.includes(c));
  const total = (xs) => xs.reduce((a, c) => a + (+c.weight || 0), 0);
  const rows = (xs, unit) => {
    const sum = total(xs) || 1;
    return `<div class="box">${xs.map(c => {
      if (c.weight == null) return `<div class="crit nobar"><div class="nm">${esc(c.name)} ${c.lot ? `<span class="pill soft">Lot ${esc(c.lot)}</span>` : ""}
        ${c.description ? `<div class="sub clamp">${esc(c.description)}</div>` : ""}<div class="meta">${cite(c.cite)}</div></div></div>`;
      const w = +c.weight;
      const width = unit === "%" ? Math.min(100, w) : unit === "points" ? 100 * w / sum : 0;
      const label = c.weight == null ? "—" : unit === "%" ? `${fmtQty(c.weight)} %` : unit === "points" ? `${fmtQty(c.weight)} pts` : `${fmtQty(c.weight)} ${c.weight_unit || ""}`;
      return `<div class="crit ${unit === "points" ? "pts" : ""}">
        <div class="nm">${esc(c.name)} ${c.lot ? `<span class="pill soft">Lot ${esc(c.lot)}</span>` : ""}
          ${c.description ? `<div class="sub clamp">${esc(c.description)}</div>` : ""}<div class="meta">${cite(c.cite)}</div></div>
        <div class="track">${width ? `<div class="fill" style="width:${width.toFixed(1)}%"></div>` : ""}</div>
        <div class="w">${esc(label)}</div></div>`;
    }).join("")}</div>`;
  };
  const both = pct.length && pts.length;
  return (pct.length ? (both ? `<h4>Weighting</h4>` : "") + rows(pct, "%") : "")
    + (pts.length ? (both || pct.length ? `<h4>Performance points <span class="src">max ${fmtQty(total(pts))}</span></h4>` : "") + rows(pts, "points") : "")
    + (rest.length ? (pct.length || pts.length ? `<h4>Evaluation rules</h4>` : "") + rows(rest, null) : "");
}

const CATEGORY = [["eligibility", "Eligibility"], ["product", "Product"], ["quality", "Quality"], ["delivery", "Delivery"],
  ["legal", "Legal & contract"], ["catalogue", "Catalogue data"], ["invoicing", "Invoicing"], ["other", "Other"]];
function requirementsHTML(list) {
  const known = new Set(CATEGORY.map(([k]) => k));
  const groups = CATEGORY.map(([k, t]) => [t, list.filter(r => (known.has(r.category) ? r.category : "other") === k)]).filter(([, xs]) => xs.length);
  return groups.map(([t, xs], i) => `<details class="b-grp" ${i === 0 || list.length <= 6 ? "open" : ""}>
    <summary>${t}<span class="n">${xs.length}</span></summary>
    <ul>${xs.map(r => `<li>${esc(r.requirement)} ${cite(r.cite)}</li>`).join("")}</ul></details>`).join("");
}

function amendmentsHTML(list) {
  const xs = [...list].sort((a, b) => (a.version ?? 0) - (b.version ?? 0) || String(a.date).localeCompare(String(b.date)));
  return `<ol class="tl">${xs.map((a, i) => `<li class="${i === xs.length - 1 ? "key" : ""}"><div class="tl-card">
    <span class="tl-when">${a.version != null ? `Version ${esc(a.version)}` : "Change"}</span><span class="tl-rel">${esc(fmtAt(a.date) || "")}</span>
    <div class="tl-lbl"><b>${esc(a.title || "")}</b> ${cite(a.cite)}</div>
    ${(a.changes || []).length ? `<ul>${a.changes.map(ch => `<li>${esc(ch)}</li>`).join("")}</ul>` : ""}
    ${(a.files_changed || []).length ? `<div class="meta"><span class="src">files:</span> ${a.files_changed.map(f => fileChip(f, a.cite?.folder)).join(" ")}</div>` : ""}
  </div></li>`).join("")}</ol>`;
}
function fileChip(file, folder) { return cite({file, folder, page: null, quote: null}); }

function contactsHTML(list) {
  return `<div class="b-cards">${list.map(c => `<div class="b-card">
    <div class="role">${esc(c.role || "Contact")}</div>
    ${c.name ? `<div><b>${esc(c.name)}</b></div>` : ""}
    ${c.email ? `<div><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>` : ""}
    ${c.phone ? `<div><a href="tel:${esc(String(c.phone).replace(/[^\d+]/g, ""))}">${esc(c.phone)}</a></div>` : ""}
    <div class="meta">${cite(c.cite)}</div></div>`).join("")}</div>`;
}

// -- dates --
function parseAt(s) {
  if (!s) return null;
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + "T23:59:59" : s);  // a bare date counts until the end of that day
  return isNaN(d) ? null : d.getTime();
}
function fmtAt(s) {
  if (!s) return "";
  const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(s);
  const d = new Date(dateOnly ? s + "T12:00:00" : s);
  if (isNaN(d)) return s;
  return d.toLocaleString(undefined, dateOnly ? {weekday: "short", day: "numeric", month: "short", year: "numeric"}
    : {weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short"});
}
function relDays(t) {
  if (t == null) return "";
  const ms = t - Date.now(), days = Math.round(Math.abs(ms) / 864e5);
  if (days === 0) return ms >= 0 ? "today" : "earlier today";
  return ms >= 0 ? `in ${days} day${days > 1 ? "s" : ""}` : `${days} day${days > 1 ? "s" : ""} ago`;
}
function countdown(at) {
  const t = parseAt(at); if (t == null) return "";
  const ms = t - Date.now();
  if (ms < 0) return `<span class="cd past">closed ${esc(relDays(t))}</span>`;
  const days = Math.floor(ms / 864e5);
  const txt = days === 0 ? `${Math.max(1, Math.ceil(ms / 36e5))} h left` : `${days} day${days > 1 ? "s" : ""} left`;
  return `<span class="cd ${days <= 2 ? "urgent" : days <= 7 ? "soon" : "ok"}">${txt}</span>`;
}

// -- citations: every brief item points at a captured attachment (opened at its page) or a captured tender page --
const normName = (s) => String(s || "").toLowerCase().replace(/[\s_]+/g, " ").trim();
const versionOf = (folder) => +((/version\s*(\d+)/i.exec(folder || "") || [])[1] || 0);
function shortName(file) {
  return String(file).replace(/\.[a-z0-9]{2,5}$/i, "").replace(/^[A-Za-z]{1,6}\d{1,4}_\d{1,2}_/, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim() || file;
}
function resolveCite(c) {
  if (!c?.file || !current) return null;
  const n = current.n;
  if (/^https?:/i.test(c.file)) {
    const bare = (u) => String(u).replace(/[#].*$/, "").replace(/\/$/, "");
    const p = n.pages.find(p => p.url === c.file) || n.pages.find(p => bare(p.url) === bare(c.file));
    return p ? {page: p} : null;
  }
  let hits = n.attachments.filter(a => a.filename === c.file);
  if (!hits.length) hits = n.attachments.filter(a => normName(a.filename) === normName(c.file));
  if (!hits.length) return null;
  const a = hits.find(a => (a.folder || "") === (c.folder || "")) || [...hits].sort((x, y) => versionOf(y.folder) - versionOf(x.folder))[0];
  return {att: a};
}
function cite(c) {
  if (!c?.file) return "";
  const i = CITES.push(c) - 1;
  const isUrl = /^https?:/i.test(c.file);
  const v = versionOf(c.folder);
  const tip = [c.folder, isUrl ? c.file : c.file, c.page ? `page ${c.page}` : "", c.quote ? `“${c.quote}”` : ""].filter(Boolean).join("\n");
  const ok = resolveCite(c);
  return `<button type="button" class="cite${ok ? "" : " dead"}" data-cite="${i}" title="${esc(tip + (ok ? "" : "\n(not among the captured documents)"))}">`
    + `<span class="cn">${esc(isUrl ? hostOf(c.file) : shortName(c.file))}</span>${v > 1 ? `<i>v${v}</i>` : ""}${c.page ? `<b>p.${esc(c.page)}</b>` : ""}</button>`;
}

async function openCite(i) {
  const c = CITES[i], target = resolveCite(c);
  if (!target) return;
  const dv = $("docview");
  dv.hidden = false; dv.scrollTop = 0;
  const quote = c.quote ? `<div class="dv-quote"><span class="k">Cited${c.page ? ` · page ${esc(c.page)}` : ""}</span>“${esc(c.quote)}”</div>` : "";
  if (target.page) {
    const p = target.page;
    dv.innerHTML = `<div class="dv-top"><button class="btn" data-back>← Back</button>
        <span class="dv-name">${esc(p.title || p.url)}</span><a href="${esc(p.url)}" target="_blank" rel="noopener">Open page ↗</a></div>
      ${quote}<div class="md" id="dv-body">${md(p.markdown || "")}</div>`;
    const m = highlight($("dv-body"), c.quote);
    if (m) m.scrollIntoView({block: "center"});
    return;
  }
  const a = target.att, isPdf = /\.pdf$/i.test(a.filename), page = c.page ? +c.page : null;
  const file = `/api/attachment/file?id=${a.id}`;
  dv.innerHTML = `<div class="dv-top"><button class="btn" data-back>← Back</button>
      <span class="dv-name">${esc(a.filename)} <span class="src">${esc(a.folder || "")}</span></span>
      ${a.stored ? `<a href="${file}" target="_blank" rel="noopener">Open ↗</a><a href="${file}&download=1">Download</a>` : ""}</div>
    ${quote}
    ${isPdf && a.stored ? `<iframe src="${file}${page ? "#page=" + page : ""}" title="${esc(a.filename)}"></iframe>` : ""}
    <div id="dv-body"><p class="src">loading text…</p></div>`;
  let text = "";
  try { text = (await (await fetch("/api/attachment?id=" + a.id)).json()).text || ""; } catch { /* shown as empty */ }
  if ($("docview").hidden || !$("dv-body")) return;
  const pageText = page ? pageOf(text, page) : null;
  const shown = pageText ?? text;
  const pre = `<pre class="atext" id="dv-text">${esc(shown || "(no text could be extracted)")}</pre>`;
  const label = pageText != null ? `Extracted text of page ${page}` : "Extracted text";
  $("dv-body").innerHTML = isPdf && a.stored ? `<details open><summary>${label}</summary>${pre}</details>` : `<p class="src">${label}</p>${pre}`;
  const m = highlight($("dv-text"), c.quote);
  if (m && !(isPdf && a.stored)) m.scrollIntoView({block: "center"});
}
function pageOf(text, page) {
  const parts = text.split(/^\[page (\d+)\][ \t]*$/m);  // extracted PDF text marks pages as "[page N]"
  for (let i = 1; i < parts.length; i += 2) if (+parts[i] === page) return parts[i + 1].trim();
  return null;
}
function highlight(root, quote) {
  if (!root || !quote) return null;
  const words = String(quote).split(/\s+/).filter(Boolean)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/-/g, "-\\s*"));  // PDF text breaks words at hyphens
  const tries = [words];  // the whole quote, then shorter runs from its start and its end
  for (const k of [10, 6, 3]) if (k < words.length) tries.push(words.slice(0, k), words.slice(-k));
  for (const run of tries) {
    const re = new RegExp(run.join("\\s*"), "i");
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let node; (node = walk.nextNode());) {
      const m = re.exec(node.data);
      if (!m) continue;
      const r = document.createRange(), mark = document.createElement("mark");
      r.setStart(node, m.index); r.setEnd(node, m.index + m[0].length);
      r.surroundContents(mark);
      return mark;
    }
  }
  return null;
}
function closeDoc() { const dv = $("docview"); dv.hidden = true; dv.innerHTML = ""; }

function inl(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = src.split("\n"), out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    let m;
    if (!l.trim()) { i++; continue; }
    if ((m = l.match(/^(#{1,6}) (.*)/))) { const h = Math.min(6, m[1].length + 2); out.push(`<h${h}>${inl(m[2])}</h${h}>`); i++; continue; }
    if (l.trim() === "---") { out.push("<hr>"); i++; continue; }
    if ((m = l.match(/^_(.+)_$/))) { out.push(`<p class="src"><em>${inl(m[1])}</em></p>`); i++; continue; }
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) { if (!/^\|(-+\|)+$/.test(lines[i])) rows.push(lines[i]); i++; }
      const cells = (r) => r.slice(1, -1).split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      out.push(`<table class="mdt"><thead><tr>${cells(rows[0]).map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${
        rows.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^(- |\d+\. )/.test(l)) {
      const ordered = /^\d/.test(l), items = [];
      while (i < lines.length && /^(- |\d+\. )/.test(lines[i])) { items.push(lines[i].replace(/^(- |\d+\. )/, "")); i++; }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inl(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    out.push(`<p>${inl(l)}</p>`); i++;
  }
  return out.join("");
}
const kb = (b) => b == null ? "" : b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
function attachmentList(list) {
  const groups = {};
  for (const a of list) (groups[a.folder || ""] ||= []).push(a);
  return Object.entries(groups).map(([folder, items]) => `
    ${folder ? `<div class="folder">${esc(folder)}</div>` : ""}
    <ul class="att">${items.map(a => `<li>
      <span class="aname">${esc(a.filename)}</span>
      <span class="src">${kb(a.size)}${a.pages ? ` · ${a.pages} p.` : ""}${a.chars ? ` · ${fmtN(a.chars)} chars` : ""}</span>
      ${a.error ? `<span class="err">${esc(a.error)}</span>` : `
        <a href="#" onclick="preview(${a.id}, ${/\.pdf$/i.test(a.filename)});return false">Preview</a>
        <a href="/api/attachment/file?id=${a.id}&download=1">Download</a>`}
    </li>`).join("")}</ul>`).join("");
}
async function preview(id, isPdf) {
  const box = $("preview"); box.hidden = false;
  const a = await (await fetch("/api/attachment?id=" + id)).json();
  const text = `<pre class="atext">${esc(a.text || "(no text could be extracted)")}</pre>`;
  box.innerHTML = `<div class="ptitle"><b>${esc(a.filename)}</b>
      <span class="src">${esc(a.folder || "")}</span>
      <a href="/api/attachment/file?id=${id}" target="_blank" rel="noopener">Open ↗</a>
      <a href="#" onclick="$('preview').hidden=true;return false">Close</a></div>
    ${isPdf ? `<iframe src="/api/attachment/file?id=${id}" title="${esc(a.filename)}"></iframe>
      <details><summary>Extracted text</summary>${text}</details>` : text}`;
  box.scrollIntoView({behavior: "smooth", block: "start"});
}
async function runEnrich(id) {
  const btn = $("enrich-btn"), st = $("enrich-status");
  btn.disabled = true; st.textContent = "fetching pages and downloading documents…";
  let r;
  try { r = await (await fetch("/api/enrich?id=" + id, {method: "POST"})).json(); } catch (e) { r = {error: String(e)}; }
  if (r.error) { st.textContent = r.error; btn.disabled = false; return; }
  openNotice(id);
}
function closeDrawer() { closeDoc(); $("drawer").classList.remove("open"); }

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("docview").hidden) closeDoc(); else closeDrawer();
});
$("drawer").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-copy]"); if (a) { e.preventDefault(); openNotice(a.dataset.copy); return; }
  const m = e.target.closest("[data-mode]"); if (m) { e.preventDefault(); setMode(m.dataset.mode); return; }
  const c = e.target.closest("[data-cite]"); if (c) { e.preventDefault(); openCite(+c.dataset.cite); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  const more = e.target.closest(".sub.clamp"); if (more) { more.classList.toggle("open"); return; }
  const doc = e.target.closest("ul.ck .ck-doc");  // clicking the document name ticks it too
  if (doc) { const box = doc.closest("li").querySelector("input[data-ck]"); box.checked = !box.checked; box.dispatchEvent(new Event("change", {bubbles: true})); }
});
$("drawer").addEventListener("change", (e) => {
  const box = e.target.closest("input[data-ck]"); if (!box || !current) return;
  const k = `tenderhub.checklist.${current.id}`, state = LS.get(k, {}) || {};
  if (box.checked) state[box.dataset.ck] = true; else delete state[box.dataset.ck];
  LS.set(k, state);
  box.closest("li").classList.toggle("done", box.checked);
  updateProgress();
});
$("docview").addEventListener("click", (e) => { if (e.target.closest("[data-back]")) closeDoc(); });
$("rows").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr) openNotice(tr.dataset.id); });
$("srcrows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-source]"); if (!tr) return;
  $("source").value = tr.dataset.source; page = 1; showTab("notices"); loadNotices();
});
for (const f of [...FILTERS, ...TOGGLES]) {
  $(f).addEventListener(f === "q" || f === "cpv" ? "input" : "change", () => {
    clearTimeout(timer); timer = setTimeout(() => { page = 1; loadNotices(); }, 250);
  });
}
$("prev").onclick = () => { page--; loadNotices(); window.scrollTo(0, 0); };
$("next").onclick = () => { page++; loadNotices(); window.scrollTo(0, 0); };
function showTab(t) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("tab-notices").hidden = t !== "notices"; $("tab-sources").hidden = t !== "sources";
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

// auto-refresh starts only after the first load has applied the URL's filters; starting it earlier let a
// refresh run with empty filters and overwrite the URL
(async () => {
  await loadStats();
  if (BOOT.get("notice")) openNotice(BOOT.get("notice"));  // ?notice=<id> opens that notice's panel
  setInterval(() => { loadStats(); if (page === 1 && !$("drawer").classList.contains("open")) loadNotices(); }, 5000);
})();
</script>
